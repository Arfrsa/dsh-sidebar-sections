# Profile-layer patch contributed by this bundle (dsh.bundle.patch).
#
# 1) Disable the shipped `ui-workspace` loader row while this bundle is enabled.
#    Its browser half owns the `sidebar.workspaces` region *and declares that
#    region's child slots* (search/row menus/row actions/directory flow). The
#    slot ledger allows only one registration to declare a child slot
#    (`SlotCore.register` throws "already declared") and the renderer only lets
#    a registration render the children it declared
#    (`boundRenderSlot` -> SlotOwnershipError). A second, lower-priority
#    occupant therefore cannot reuse the official sub-slots; a full replacement
#    is the only supported way to fork the browser and keep those slots.
#    Our bundle is a patched build of the same official client code and keeps
#    every official registration, so disabling this row loses nothing.
#    When this bundle is disabled or uninstalled its patch layer disappears and
#    the shipped row comes back unchanged.
#
# 2) Mount this bundle's own row (host half `lib/index.js` + patched browser
#    half `lib/client.js`, discovered through `package.json` `dsh.client`).
- id: ui-workspace
  disabled: true
- insert:
    - id: sidebar-sections
      name: dsh-sidebar-sections
